[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organism"
version = "0.1.0"
description = "Longitudinal Organism identity and private-state contracts for Biopeia"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"organism.cognition" = ["defaults/*.json"]
"organism.genetics" = ["defaults/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
